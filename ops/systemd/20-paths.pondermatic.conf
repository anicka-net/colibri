# Host-local paths and compatibility aliases for the Pondermatic deployment.
[Service]
WorkingDirectory=%h/colibri-production/c
ExecStartPre=
ExecStartPre=%h/colibri-production/ops/colibri-preflight.sh
ExecStart=
ExecStart=%h/colibri-production/c/coli serve --model ${COLI_MODEL} --host ${COLI_HOST} --port ${COLI_PORT} --model-id ${COLI_MODEL_ID} --model-alias deepseek-v4-pro --hidden-model-alias deepseek-chat --default-thinking --context-length ${COLI_CONTEXT} --cap ${COLI_CAP} --ctx ${COLI_CONTEXT} --ngen ${COLI_MAX_TOKENS} --expert-bits ${COLI_EXPERT_BITS} --dense-bits ${COLI_DENSE_BITS} --kv-slots ${COLI_KV_SLOTS} --cors-origin ${COLI_CORS_ORIGIN}
StandardOutput=append:%h/.colibri/server.log
StandardError=append:%h/.colibri/server.log
